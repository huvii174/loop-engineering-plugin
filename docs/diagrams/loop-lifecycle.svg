    <rect x="640" y="224" width="76" height="16" rx="2" fill="#f5f5f5"/>
    <text x="680" y="236" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONTINUE</text>
    <path d="M 856 472 L 748 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="760" y="448" width="76" height="16" rx="2" fill="#f5f5f5"/>
    <text x="800" y="460" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOAL MET</text>
    <path d="M 548 472 L 504 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
