    <text x="880" y="568" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXIT 2</text>
    <rect x="40" y="100" width="200" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="40" y="100" width="200" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <rect x="52" y="108" width="40" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
    <text x="72" y="120" fill="#2d3142" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CMD</text>
