<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="loop-lifecycle-title loop-lifecycle-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="loop-lifecycle-title">How one loop iteration runs</title>
      <desc id="loop-lifecycle-desc">Flowchart of the goal-based loop: the design gate produces the goal, then each iteration plans an increment, acts, and is judged by a fresh-context verifier before the deterministic breaker decides whether to continue, clear the review gate into done, or stop as stuck.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>
    <text x="40" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FLOWCHART · LOOP-ENGINEERING</text>
