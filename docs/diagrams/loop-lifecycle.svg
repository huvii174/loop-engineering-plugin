    <path d="M 748 144 L 792 144" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 1000 144 L 1132 144 Q 1140 144 1140 152 L 1140 280" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="1004" y="120" width="136" height="16" rx="2" fill="#f5f5f5"/>
    <text x="1072" y="132" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPROVE / REJECT</text>
    <path d="M 1140 368 L 1140 464 Q 1140 472 1132 472 L 1064 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="1056" y="412" width="60" height="16" rx="2" fill="#f5f5f5"/>
    <text x="1088" y="424" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RECORD</text>
