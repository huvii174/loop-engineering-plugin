    <text x="1140" y="320" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Record</text>
    <text x="1140" y="340" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">state.json</text>
    <polygon points="960,416 1064,472 960,528 856,472" fill="#f5f5f5"/>
    <polygon points="960,416 1064,472 960,528 856,472" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="960" y="468" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stop?</text>
    <text x="960" y="488" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">loop-breaker.mjs</text>
    <rect x="548" y="428" width="200" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="548" y="428" width="200" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <rect x="560" y="436" width="48" height="16" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
    <text x="584" y="448" fill="#2d3142" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
    <text x="648" y="468" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review gate</text>
    <text x="648" y="488" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">parallel, fresh</text>
    <rect x="304" y="428" width="200" height="88" rx="44" fill="#f5f5f5"/>
    <rect x="304" y="428" width="200" height="88" rx="44" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="404" y="468" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">done</text>
    <text x="404" y="488" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">criteria proven</text>
    <rect x="40" y="428" width="200" height="88" rx="44" fill="#f5f5f5"/>
    <rect x="40" y="428" width="200" height="88" rx="44" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="140" y="468" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stuck</text>
    <text x="140" y="488" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">diagnose, then ask</text>
    <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
    <text x="40" y="664" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OVAL · TERMINAL</text>
    <text x="340" y="664" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RECT · STEP</text>
    <text x="640" y="664" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DIAMOND · DECISION</text>
    <text x="940" y="664" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CORAL · FRESH CONTEXT</text>
    </svg>