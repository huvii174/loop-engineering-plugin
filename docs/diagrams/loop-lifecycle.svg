    <text x="404" y="160" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">+ already tried</text>
    <rect x="548" y="100" width="200" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="548" y="100" width="200" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="648" y="140" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Act</text>
    <text x="648" y="160" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">one increment</text>
    <polygon points="896,88 1000,144 896,200 792,144" fill="#f5f5f5"/>
    <polygon points="896,88 1000,144 896,200 792,144" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="896" y="140" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">loop-verifier</text>
    <text x="896" y="160" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">fresh context</text>
    <rect x="1040" y="280" width="200" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="1040" y="280" width="200" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
