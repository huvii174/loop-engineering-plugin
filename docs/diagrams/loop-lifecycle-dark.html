<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How one loop iteration runs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · loop-engineering</p>
    <h1>How one loop iteration runs</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="loop-lifecycle-dark-title loop-lifecycle-dark-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="loop-lifecycle-dark-title">How one loop iteration runs</title>
      <desc id="loop-lifecycle-dark-desc">Flowchart of the goal-based loop: the design gate produces the goal, then each iteration plans an increment, acts, and is judged by a fresh-context verifier before the deterministic breaker decides whether to continue, clear the review gate into done, or stop as stuck.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>
    <rect width="100%" height="100%" fill="#2d3142"/>

    <path d="M 748 144 L 792 144" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

    <path d="M 1140 368 L 1140 464 Q 1140 472 1132 472 L 1064 472" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="1056" y="412" width="60" height="16" rx="2" fill="#2d3142"/>

    <text x="800" y="460" fill="#8e98ac" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOAL MET</text>
    <path d="M 548 472 L 504 472" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

    <text x="880" y="568" fill="#8e98ac" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXIT 2</text>
    <rect x="40" y="100" width="200" height="88" rx="6" fill="#2d3142"/>
    <rect x="40" y="100" width="200" height="88" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
    <rect x="52" y="108" width="40" height="16" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.40" stroke-width="0.8"/>
    <text x="72" y="120" fill="#f5f5f5" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CMD</text>
    <text x="140" y="140" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Design gate</text>

    <rect x="548" y="100" width="200" height="88" rx="6" fill="#2d3142"/>
    <rect x="548" y="100" width="200" height="88" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
    <text x="648" y="140" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Act</text>
    <text x="648" y="160" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">one increment</text>
    <polygon points="896,88 1000,144 896,200 792,144" fill="#2d3142"/>
    <polygon points="896,88 1000,144 896,200 792,144" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>
    <text x="896" y="140" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">loop-verifier</text>
    <text x="896" y="160" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">fresh context</text>
    <rect x="1040" y="280" width="200" height="88" rx="6" fill="#2d3142"/>
    <rect x="1040" y="280" width="200" height="88" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
    <rect x="1052" y="288" width="56" height="16" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.40" stroke-width="0.8"/>

    <text x="1140" y="340" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">state.json</text>
    <polygon points="960,416 1064,472 960,528 856,472" fill="#2d3142"/>

    <text x="960" y="468" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stop?</text>
    <text x="960" y="488" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">loop-breaker.mjs</text>
    <rect x="548" y="428" width="200" height="88" rx="6" fill="#2d3142"/>
    <rect x="548" y="428" width="200" height="88" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
    <rect x="560" y="436" width="48" height="16" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.40" stroke-width="0.8"/>
    <text x="584" y="448" fill="#f5f5f5" fill-opacity="0.8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
    <text x="648" y="468" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Review gate</text>
    <text x="648" y="488" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">parallel, fresh</text>
    <rect x="304" y="428" width="200" height="88" rx="44" fill="#2d3142"/>
    <rect x="304" y="428" width="200" height="88" rx="44" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
    <text x="404" y="468" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">done</text>
    <text x="404" y="488" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">criteria proven</text>
    <rect x="40" y="428" width="200" height="88" rx="44" fill="#2d3142"/>
    <rect x="40" y="428" width="200" height="88" rx="44" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
    <text x="140" y="468" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stuck</text>
    <text x="140" y="488" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">diagnose, then ask</text>
    <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
    <text x="40" y="664" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OVAL · TERMINAL</text>
    <text x="340" y="664" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RECT · STEP</text>
    <text x="640" y="664" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DIAMOND · DECISION</text>
    <text x="940" y="664" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CORAL · FRESH CONTEXT</text>

</html>
