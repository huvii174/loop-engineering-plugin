<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Every run leaves the store smarter</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #2d3142;
      --color-ink:    #f5f5f5;
      --color-muted:  #bfc0c0;
      --color-accent: #f08a59;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Loop · loop-engineering</p>
    <h1>Every run leaves the store smarter</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="memory-compounding-dark-title memory-compounding-dark-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="memory-compounding-dark-title">Every run leaves the store smarter</title>
      <desc id="memory-compounding-dark-desc">Reinforcing loop of compounding memory: scratch notes are distilled, shaped into one-liners, solution entries or epic rollups, promoted through a gate, and recalled under budget by the next run, while .loop/memory accumulates the shared record.</desc>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker>
      </defs>
    <rect width="100%" height="100%" fill="#2d3142"/>

    <text x="640" y="336" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">one store, every run</text>
    <rect x="560" y="64" width="160" height="64" rx="6" fill="#2d3142"/>
    <rect x="560" y="64" width="160" height="64" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>

    <text x="640" y="112" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">written mid-run</text>
    <rect x="756" y="176" width="160" height="64" rx="6" fill="#2d3142"/>
    <rect x="756" y="176" width="160" height="64" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
    <text x="836" y="204" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Distil</text>

    <rect x="560" y="512" width="160" height="64" rx="6" fill="#2d3142"/>
    <rect x="560" y="512" width="160" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/>

    <rect x="364" y="400" width="160" height="64" rx="6" fill="#2d3142"/>
    <rect x="364" y="400" width="160" height="64" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>

    <text x="444" y="448" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">grep by tag, max 5</text>
    <rect x="364" y="176" width="160" height="64" rx="6" fill="#2d3142"/>
    <rect x="364" y="176" width="160" height="64" rx="6" fill="#2d3142" stroke="#f5f5f5" stroke-width="1"/>
    <text x="444" y="204" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Next run</text>

    <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/>
    <text x="40" y="664" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RING · THE RUN</text>
    <text x="340" y="664" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DASHED · WRITE-BACK</text>
    <text x="640" y="664" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HUB · ONE STORE</text>
    <text x="940" y="664" fill="#bfc0c0" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CORAL · HUMAN GATE</text>
    </svg>
  </div>
</body>
</html>
