<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The circuit breaker decides, in code</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #eb6c36;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · loop-engineering</p>
    <h1>The circuit breaker decides, in code</h1>
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="circuit-breaker-title circuit-breaker-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="circuit-breaker-title">The circuit breaker decides, in code</title>
      <desc id="circuit-breaker-desc">State machine of a loop run: designed becomes running, each verified increment loops back, and the deterministic breaker moves the run to stuck on a tripped counter, to stopped-max-iterations on budget, or through the review gate to done.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>
    <text x="40" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">STATE MACHINE · LOOP-ENGINEERING</text>
    <path d="M 78 200 L 120 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 320 200 L 440 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="344" y="176" width="76" height="16" rx="2" fill="#f5f5f5"/>
    <text x="380" y="188" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOOP CMD</text>
    <path d="M 500 156 L 500 128 Q 500 120 508 120 L 572 120 Q 580 120 580 128 L 580 156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="484" y="96" width="112" height="16" rx="2" fill="#f5f5f5"/>
    <text x="540" y="108" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS / RECORD</text>
    <path d="M 540 244 L 540 396" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="560" y="312" width="60" height="16" rx="2" fill="#f5f5f5"/>
    <text x="592" y="324" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXIT 2</text>
    <path d="M 488 396 L 488 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="396" y="312" width="56" height="16" rx="2" fill="#f5f5f5"/>
    <text x="424" y="324" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESET</text>
    <path d="M 592 244 L 592 332 Q 592 340 600 340 L 852 340 Q 860 340 860 348 L 860 396" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="696" y="316" width="60" height="16" rx="2" fill="#f5f5f5"/>
    <text x="728" y="328" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUDGET</text>
    <path d="M 640 200 L 960 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="760" y="176" width="76" height="16" rx="2" fill="#f5f5f5"/>
    <text x="800" y="188" fill="#7a8399" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GOAL MET</text>
    <path d="M 1160 200 L 1208 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <circle cx="72" cy="200" r="6" fill="#2d3142"/>
    <rect x="120" y="156" width="200" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="120" y="156" width="200" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="220" y="196" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">designed</text>
    <text x="220" y="216" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">goal.md written</text>
    <rect x="440" y="156" width="200" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="440" y="156" width="200" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="540" y="196" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">running</text>
    <text x="540" y="216" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">one increment / iter</text>
    <rect x="960" y="156" width="200" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="960" y="156" width="200" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="1060" y="196" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">done</text>
    <text x="1060" y="216" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">review gate cleared</text>
    <circle cx="1216" cy="200" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
    <circle cx="1216" cy="200" r="5" fill="#2d3142"/>
    <rect x="440" y="396" width="200" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="440" y="396" width="200" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="540" y="436" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stuck</text>
    <text x="540" y="456" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">diagnose, then ask</text>
    <rect x="740" y="396" width="240" height="88" rx="6" fill="#f5f5f5"/>
    <rect x="740" y="396" width="240" height="88" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
    <text x="860" y="436" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">stopped-max-iterations</text>
    <text x="860" y="456" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">resume with a new max</text>
    <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
    <text x="40" y="664" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">STAGNATION 3 · FRUSTRATION 3</text>
    <text x="340" y="664" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">NO-PROGRESS 5 · PLATEAU 8</text>
    <text x="640" y="664" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ADVISORY AT THRESHOLD-1</text>
    <text x="940" y="664" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em">BOOKKEEPING PASS = TRANSPARENT</text>
    </svg>
  </div>
</body>
</html>
