<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="memory-compounding-title memory-compounding-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="memory-compounding-title">Every run leaves the store smarter</title>
      <desc id="memory-compounding-desc">Reinforcing loop of compounding memory: scratch notes are distilled, shaped into one-liners, solution entries or epic rollups, promoted through a gate, and recalled under budget by the next run, while .loop/memory accumulates the shared record.</desc>
